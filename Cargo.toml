[workspace]
members = [
    "crates/amd",
    "crates/benchmark",
    "crates/cpu",
    "crates/gpu",
    "crates/intel-gpu",
    "crates/local-store",
    "crates/nvidia",
    "crates/optimizer-core",
    "crates/pubg",
    "crates/windows-agent",
    "crates/windows-api",
]
resolver = "2"

[workspace.package]
authors = ["Liiiraa"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Liiiraa/Liiiraa-booster"
rust-version = "1.80"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = "warn"
cargo = "warn"
nursery = "warn"
pedantic = "warn"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
