[package]
name = "liiiraa-booster-desktop"
version = "0.0.0"
description = "Liiiraa Booster desktop shell"
authors = ["Liiiraa"]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
optimizer-core = { path = "../../../crates/optimizer-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[lints.rust]
unsafe_code = "forbid"
