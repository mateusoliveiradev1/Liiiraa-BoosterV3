name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # Pin action refs to full-length commit SHAs; refresh pins only through reviewed updates.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        # Keep official and third-party actions pinned before any job receives secrets or write permissions.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit message range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            from="${{ github.event.pull_request.base.sha }}"
          else
            from="HEAD~1"
          fi

          pnpm commitlint --from "$from" --to HEAD --verbose

      - name: Verify workflow permissions are explicit
        run: grep -R "permissions:" .github/workflows
